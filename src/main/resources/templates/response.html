<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags for Bootstrap. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS link. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

    <title>Response Fragments</title>
</head>
<body>
    <!-- The following are the Thymeleaf fragments returned by the Muromuro server
         as part of the HTMX response. They are reused by all Muromuro question page views. -->

    <div th:fragment="success" class="alert alert-success col-lg-6">
        <b th:text="'Correct answer: ' + ${muroMuroSolution.response.message}"></b>
    </div>

    <div th:fragment="failure" class="alert alert-danger col-lg-6">
<pre><code><b th:text="'Wrong answer: ' + ${muroMuroSolution.response.message}"></b></code></pre>
    </div>

    <div th:fragment="timeout" class="alert alert-warning col-lg-6">
        <b th:text="'Server timed out: ' + ${muroMuroSolution.response.message}"></b>
    </div>

    <div th:fragment="unknown" class="alert alert-warning col-lg-6">
<pre><code><b th:text="'Unknown response: ' + ${muroMuroSolution.response.message}"></b></code></pre>
    </div>

    <!-- Bootstrap JS link. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
