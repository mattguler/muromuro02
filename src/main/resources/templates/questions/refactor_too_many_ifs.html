<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags for Bootstrap. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS link. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

    <link rel="stylesheet" type="text/css" th:href="@{/css/viewstyle.css}" />
    <script th:src="@{/js/viewutils.js}"></script>

    <title>Refactoring Too Many Ifs</title>
</head>

<body>
<div class="container bg-light">
    <h2>Refactoring Too Many Ifs</h2>
    <hr>
    <p>
        You are given the following code, which seems to contain too many if statements.
    </p>
    <p>
        Could you please refactor this code in a way that reduces the if statements and
        makes it more readable?
    </p>
    <hr>
    <!-- TODO: Change this form's method to POST when implementing its backend. -->
    <form action="#" th:action="@{/muromuro_questions/refactor_too_many_ifs}"
            method="GET">
        <pre><code>
<!-- Update the for, id, and name here to use th:for and th:field. -->
<label for="mainDefinition">Please refactor the code here:</label>

<textarea rows="12" cols="80" id="mainDefinition" name="mainDefinition"></textarea>
        </code></pre>
        <button type="submit" class="btn btn-info col-2">Submit</button>
    </form>
</div>
<!-- Bootstrap JS link. -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>

</html>
